# HADDOCK3 configuration used for every peptide.
# {{PEPTIDE}} and {{PEPTIDE_LENGTH}} are filled in by scripts/make_haddock_runs.py.

run_dir = "{{PEPTIDE}}"

# execution mode
mode = "local"
ncores = 8

molecules = [
    "protein.pdb",
    "{{PEPTIDE}}.pdb"
    ]

[topoaa]
autohis = false

# Keap1 Kelch-domain histidine protonation states, assigned once and kept fixed
[topoaa.mol1]
nhisd = 2
hisd_1 = 36
hisd_2 = 109
nhise = 1
hise_1 = 113

[rigidbody]
tolerance = 5.0
ambig_fname = "tbl.tbl"
sampling = 2000

[caprieval]
reference_fname = "reference.pdb"

[seletop]
select = 100

[flexref]
tolerance = 5.0
ambig_fname = "tbl.tbl"

# peptide (chain B) fully flexible
fle_sta_1 = 1
fle_end_1 = {{PEPTIDE_LENGTH}}
fle_seg_1 = "B"

ssdihed = "alphabeta"

mdsteps_rigid = 2000
mdsteps_cool1 = 2000
mdsteps_cool2 = 4000
mdsteps_cool3 = 4000

[caprieval]
reference_fname = "reference.pdb"

[emref]
tolerance = 5.0
ambig_fname = "tbl.tbl"

fle_sta_1 = 1
fle_end_1 = {{PEPTIDE_LENGTH}}
fle_seg_1 = "B"

ssdihed = "alphabeta"

[caprieval]
reference_fname = "reference.pdb"

[clustfcc]

[seletopclusts]
top_models = 4

[caprieval]
reference_fname = "reference.pdb"

[caprieval]
allatoms = true
reference_fname = "reference.pdb"
